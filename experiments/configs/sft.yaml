# Parameter-efficient supervised fine-tuning
experiment:
  name: smollm_wordle_lora
  seed: 42
  output_dir: experiments/results/sft
model:
  name: HuggingFaceTB/SmolLM-360M-Instruct
  revision: main
  dtype: bfloat16
  gradient_checkpointing: true
data:
  train_file: data/generated/train.jsonl
  validation_file: data/generated/validation.jsonl
  max_length: 512
  shuffle_buffer: 10000
  train_limit: null
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  bias: none
training:
  epochs: 3
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  logging_steps: 20
  eval_steps: 250
  save_steps: 250
  save_total_limit: 2
  completion_only_loss: true
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  report_to: none
evaluation:
  benchmark_config: experiments/configs/base.yaml
  max_games: 1000
