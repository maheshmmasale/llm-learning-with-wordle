# Reproducible zero-/few-shot benchmark configuration
experiment:
  name: smollm_base
  seed: 42
  output_dir: experiments/results
model:
  name: HuggingFaceTB/SmolLM-360M-Instruct
  revision: main
  dtype: auto
  device_map: auto
  trust_remote_code: false
data:
  answers: data/wordle/answers.txt
  allowed_guesses: data/wordle/allowed.txt
  split: test
  max_games: 1000
generation:
  max_new_tokens: 32
  do_sample: false
  temperature: 1.0
  top_p: 1.0
  num_return_sequences: 1
prompt:
  strategy: structured_constraints
  include_candidates: false
  request_reasoning: false
evaluation:
  max_turns: 6
  reject_invalid: true
  count_invalid_as_turn: true
  save_per_game: true
  report_bootstrap_ci: true
  bootstrap_samples: 10000
  metrics: [win_rate, average_guesses_wins, invalid_guess_rate, model_calls, wall_seconds]
